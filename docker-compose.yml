services:

  postgres:
    image: postgres:16
    container_name: mattermost-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - ./postgres/data:/var/lib/postgresql/data

    networks:
      - mattermost-backend

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  mattermost:
    image: mattermost/mattermost-team-edition:${MATTERMOST_VERSION}
    container_name: mattermost
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres

      MM_SQLSETTINGS_DATASOURCE: >-
        postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable&connect_timeout=10

      MM_SERVICESETTINGS_SITEURL: ${MATTERMOST_SITE_URL}

      MM_SERVICESETTINGS_LISTENADDRESS: ":8065"

      HTTP_PROXY: "http://1.2.3.4:8080"
      HTTPS_PROXY: "http://1.2.3.4:8080"

      NO_PROXY: "localhost,127.0.0.1,postgres,mattermost"

    volumes:
      - ./mattermost/config:/mattermost/config
      - ./mattermost/data:/mattermost/data
      - ./mattermost/logs:/mattermost/logs
      - ./mattermost/plugins:/mattermost/plugins
      - ./mattermost/client-plugins:/mattermost/client/plugins
      - ./mattermost/bleve-indexes:/mattermost/bleve-indexes

    expose:
      - "8065"

    networks:
      - mattermost-backend
      - mattermost-frontend

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:8065/api/v4/system/ping || exit 1"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s


  nginx:
    image: nginx:1.28-alpine
    container_name: mattermost-nginx
    restart: unless-stopped

    depends_on:
      mattermost:
        condition: service_healthy

    ports:
      - "80:80"

    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro

    networks:
      - mattermost-frontend


networks:

  mattermost-backend:
    internal: true

  mattermost-frontend:
    driver: bridge
